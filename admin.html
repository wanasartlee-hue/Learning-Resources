<style id="st">
/* Layout: deep-purple header band with fiscal-year picker → category tabs with counts → search + ตำบล filter → card grid. Editors get an edit bar and a form sheet. */
:root{
  --bg:#f7f5fb; --surface:#ffffff; --fg:#1e1530; --muted:#62577a; --line:#e3dcef;
  --header:#4a1d7f; --header-ink:#ffffff; --purple:#5b2a91; --purple-soft:#efe7f8;
  --yellow:#f5c518; --yellow-soft:#fdf3c4; --on-yellow:#2a1d00;
  --chip:#ece6f4; --focus:#7b3fe4; --danger:#b42318; --scrim:rgba(20,10,35,.55);
  --font:"K2D","Leelawadee UI","Tahoma",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#130e1c; --surface:#1d1628; --fg:#ede7f6; --muted:#a99cbe; --line:#332848;
  --header:#2e1350; --header-ink:#f5f0fc; --purple:#c7a4f6; --purple-soft:#2a1f3d;
  --yellow:#f5c518; --yellow-soft:#3a3112; --on-yellow:#2a1d00;
  --chip:#2a2138; --focus:#c7a4f6; --danger:#ff8a80; --scrim:rgba(0,0,0,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#130e1c; --surface:#1d1628; --fg:#ede7f6; --muted:#a99cbe; --line:#332848;
  --header:#2e1350; --header-ink:#f5f0fc; --purple:#c7a4f6; --purple-soft:#2a1f3d;
  --yellow:#f5c518; --yellow-soft:#3a3112; --on-yellow:#2a1d00;
  --chip:#2a2138; --focus:#c7a4f6; --danger:#ff8a80; --scrim:rgba(0,0,0,.65); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15.5px;line-height:1.6}
button,input,select,textarea{font:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--header);color:var(--header-ink);position:relative}
header .wrap{padding-block:30px 32px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
header .titles{min-width:0;flex:1 1 100%}
.hbar{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.who{font-size:13.5px;opacity:.9;margin-right:auto;margin-left:10px}
header::after{content:"";position:absolute;inset:auto 0 0 0;height:8px;
  background:repeating-linear-gradient(90deg,var(--yellow) 0 18px,transparent 18px 24px,var(--yellow) 24px 28px,transparent 28px 36px)}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:16px;font-weight:600;margin:0 0 6px}
.eyebrow select{background:transparent;color:var(--yellow);border:1.5px solid var(--yellow);border-radius:6px;padding:1px 6px;font-weight:700;font-size:16px;cursor:pointer}
.eyebrow select option{color:#1e1530;background:#fff}
h1{font-weight:800;font-size:clamp(28px,4.6vw,46px);line-height:1.25;margin:0;text-wrap:balance}
h1 .slash{color:var(--yellow)}
.sub{margin:6px 0 0;font-size:17px;opacity:.9}
.btn{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:14.5px}
.btn:hover{border-color:var(--purple)}
.btn.primary{background:var(--purple);border-color:var(--purple);color:var(--surface)}
.btn.yellow{background:var(--yellow);border-color:var(--yellow);color:var(--on-yellow)}
.btn.danger{color:var(--danger);border-color:currentColor;background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding-block:22px 8px}
.tab{all:unset;cursor:pointer;background:var(--surface);color:var(--fg);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tab:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tab .n{font-size:30px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--purple)}
.tab .t{font-weight:600;font-size:14.5px;line-height:1.35}
.tab[aria-selected="true"]{background:var(--header);border-color:var(--header);color:var(--header-ink)}
.tab[aria-selected="true"] .n{color:var(--yellow)}
.editbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--yellow-soft);border:1.5px dashed var(--yellow);border-radius:10px;padding:10px 12px;margin-top:8px}
.editbar .lbl{font-weight:700;margin-right:auto;font-size:14.5px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:12px}
.search{flex:1 1 280px;min-width:0;position:relative}
.search input{width:100%;padding:10px 14px 10px 38px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.tools select{padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);flex:0 1 220px;min-width:0}
.desc{color:var(--muted);margin:4px 0 0;font-size:14.5px}
.count{color:var(--muted);font-size:14px;margin:0;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;padding:8px 0 40px;list-style:none;margin:0}
.card{background:var(--surface);border:2px solid var(--yellow);border-radius:10px;padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;min-width:0}
.no{font-weight:800;color:var(--purple);font-size:19px;font-variant-numeric:tabular-nums;min-width:1.8em;line-height:1.5}
.body{min-width:0;display:flex;flex-direction:column;gap:6px}
.name{font-weight:700;font-size:16.5px;line-height:1.45;margin:0;text-wrap:pretty}
.skill{align-self:flex-start;background:var(--yellow-soft);color:var(--fg);border-radius:6px;padding:2px 9px;font-size:14px;font-weight:600}
.row{display:flex;gap:8px;font-size:14.5px;color:var(--muted);align-items:flex-start}
.row svg{flex:none;width:15px;height:15px;margin-top:4px;stroke:currentColor;fill:none;stroke-width:1.8}
.row b{font-weight:600;color:var(--fg)}
.area{font-size:12.5px;background:var(--chip);color:var(--muted);border-radius:99px;padding:1px 10px;align-self:flex-start}
.phone{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.phone .num{font-variant-numeric:tabular-nums;color:var(--fg);font-weight:600;user-select:all}
.copy{font-size:12.5px;padding:2px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--muted);cursor:pointer}
.copy:hover{color:var(--fg);border-color:var(--muted)}
.cardact{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.cardact .btn{padding:3px 10px;font-size:13px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 0}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}
footer .wrap{padding-block:18px 28px}
mark{background:var(--yellow);color:var(--on-yellow);border-radius:3px;padding:0 1px}
.modal{position:fixed;inset:0;background:var(--scrim);z-index:50;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);color:var(--fg);border-radius:12px;width:min(540px,100%);max-height:100%;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:12px;border-top:6px solid var(--yellow)}
.sheet h2{margin:0;font-size:21px;font-weight:800}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-weight:600;font-size:14px}
.fld input,.fld select,.fld textarea{padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%}
.fld .hint{font-size:13px;color:var(--muted)}
.radios{display:flex;flex-direction:column;gap:6px}
.radios label{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:500}
.fld .radios input[type=radio]{width:auto;flex:none;margin:0}
.fld .radios select{width:auto;padding:4px 8px}
.pw{position:relative}
.fld .pw input{padding-right:46px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:34px;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.eye:hover{color:var(--fg);background:var(--chip)}
.eye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.merr{color:var(--danger);margin:0;font-size:14px;min-height:1em}
.mact{display:flex;gap:8px;justify-content:flex-end}
.btn.outline-y{background:transparent;color:var(--yellow);border-color:var(--yellow)}
.btn.outline-y:hover{background:var(--yellow);color:var(--on-yellow)}
/* PDF report pages: a deliberately light, print-style look, rendered off-screen */
#rpt{position:fixed;left:-20000px;top:0;z-index:-1}
.rpage{width:1123px;height:794px;background:#ffffff;color:#1e1530;font-family:var(--font);padding:36px 44px 26px;display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.rhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;border-bottom:3px solid #f5c518;padding-bottom:8px;font-size:13px;color:#4a1d7f;font-weight:600}
.rbody{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:10px}
.rfoot{display:flex;justify-content:space-between;font-size:12px;color:#62577a;border-top:1px solid #e3dcef;padding-top:6px}
.rcover{display:flex;flex-direction:column;gap:6px;padding-top:40px}
.rcover .k{font-size:18px;font-weight:600;color:#62577a;margin:0}
.rcover h1{font-size:40px;color:#4a1d7f;margin:0;line-height:1.3}
.rcover .y{display:inline-block;align-self:flex-start;background:#f5c518;color:#2a1d00;font-weight:800;font-size:22px;border-radius:8px;padding:2px 14px;margin-top:6px}
.rsum{border-collapse:collapse;margin-top:28px;width:560px;font-size:17px}
.rsum td{padding:10px 14px;border-bottom:1px solid #e3dcef}
.rsum td:last-child{text-align:right;font-weight:800;color:#4a1d7f;font-variant-numeric:tabular-nums}
.rsum tr.tot td{border-bottom:none;border-top:2px solid #4a1d7f;font-weight:800}
.rh2{margin:0;font-size:20px;font-weight:800;color:#4a1d7f;display:flex;gap:10px;align-items:baseline}
.rh2 small{font-size:14px;color:#62577a;font-weight:600}
.rtbl{border-collapse:collapse;width:100%;font-size:13.5px;line-height:1.45;table-layout:fixed}
.rtbl th{background:#4a1d7f;color:#ffffff;font-weight:600;text-align:left;padding:7px 9px}
.rtbl td{padding:6px 9px;border-bottom:1px solid #e3dcef;vertical-align:top;overflow-wrap:anywhere}
.rtbl tr:nth-child(even) td{background:#f7f5fb}
.rtbl td.c,.rtbl th.c{text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--header);color:var(--header-ink);padding:10px 18px;border-radius:99px;z-index:60;font-weight:600;max-width:calc(100% - 32px);text-align:center}
@media (max-width:720px){.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}}
</style>

<div id="shell">
<header>
  <div class="wrap">
    <div class="titles">

    </div>
    <div class="hbar"><button class="btn outline-y" id="pdfBtn" hidden>ดาวน์โหลด PDF</button><a href="./" style="color:var(--yellow);font-weight:600;font-size:14.5px">← ไปหน้าเว็บหลัก</a><span class="who" id="who" hidden></span><button class="btn yellow" id="editToggle" hidden>แก้ไขข้อมูล</button></div>
  </div>
</header>

<main class="wrap">
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="editbar" id="editbar" hidden>
    <span class="lbl" id="editlbl">โหมดแก้ไข</span>

    <button class="btn" id="addYear">+ เพิ่มปีงบประมาณ</button>
    <button class="btn danger" id="delYear">ลบปีงบประมาณนี้</button>
    <button class="btn" id="logout">ออกจากระบบ</button>
  </div>
  <p class="desc" id="desc"></p>
  <div class="tools">
    <label class="search" for="q">
      <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="ค้นหาชื่อ ที่อยู่ ผู้ดูแล หรือความชำนาญ" aria-label="ค้นหา">
    </label>
    <select id="area" aria-label="กรองตามตำบล"></select>
    <p class="count" id="count"></p>
  </div>
  <ul class="grid" id="list"></ul>
</main>

<footer><div class="wrap" id="foot"></div></footer>

<div class="modal" id="modal" hidden>
  <form class="sheet" id="form" novalidate>
    <h2 id="mtitle"></h2>
    <div id="mfields" style="display:flex;flex-direction:column;gap:12px"></div>
    <p class="merr" id="merr"></p>
    <div class="mact">
      <button type="button" class="btn" id="mcancel">ยกเลิก</button>
      <button type="submit" class="btn primary" id="msave">บันทึก</button>
    </div>
  </form>
</div>
<div class="toast" id="toast" hidden></div>
<div id="rpt" hidden aria-hidden="true"></div>

/* ---------- text helpers ---------- */
function clean(s){
  if(s == null) return '';
  return String(s).trim()
    .replace(/([ัิ-ฺ็-๎])\1+/g,'$1')
    .replace(/อำเเภอ/g,'อำเภอ').replace(/เเ/g,'แ').replace(/เชียราย/g,'เชียงราย')
    .replace(/^ที่ตั้ง\s*:\s*/,'').replace(/\s+/g,' ').replace(/\s*\(\s*$/,'').trim();
}
function fmtPhone(p){ p = String(p||'').replace(/\D/g,''); return p.length===10 ? p.slice(0,3)+'-'+p.slice(3,6)+'-'+p.slice(6) : p; }
function areaOf(addr){
  const a = String(addr||'').split(' / ')[0];
  const t = (a.match(/(?:ต\.|ตำบล)\s*([^\s]+?)(?=\s|อ\.|อำเภอ|$)/)||[])[1] || '';
  let p = (a.match(/(?:อ\.|อำเภอ)\s*([^\s]+?)(?=\s|จ\.|จังหวัด|$)/)||[])[1] || '';
  if(!p && /เทิง/.test(a)) p = 'เทิง';
  if(!t) return 'ไม่ระบุตำบล';
  return (p==='เทิง' || !p) ? 'ต.'+t : 'นอกอำเภอเทิง';
}
function hl(s, q){ s = esc(s); if(!q) return s; const k = esc(q); const i = s.toLowerCase().indexOf(k.toLowerCase()); return i<0 ? s : s.slice(0,i)+'<mark>'+s.slice(i,i+k.length)+'</mark>'+s.slice(i+k.length); }

function card(x, i, q){

    if(x.keeper) r.push(`<div class="row">${I.user}<span>ผู้ดูแล <b>${hl(x.keeper,q)}</b></span></div>`);

/* ---------- saving: Firebase Firestore ---------- */
let toastT;
function toast(msg, ms){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); if(ms) toastT=setTimeout(()=>t.hidden=true, ms); }
function refresh(){ if(!S.years[year]) year = years()[0]; renderYear(); renderTabs(); renderArea(); renderList(); renderEdit(); }
const pack = d => ({learn:d.learn||[], read:d.read||[], network:d.network||[], wisdom:d.wisdom||[]});
async function save(next, keepYear){
  if(busy) return false;
  if(!fb){ toast(fbMsg, 5000); return false; }
  if(!who){ toast('กรุณาเข้าสู่ระบบก่อนแก้ไข', 4000); return false; }
  busy = true; toast('กำลังบันทึก…');
  try{
    const col = fb.db.collection('years'), batch = fb.db.batch();
    for(const y of Object.keys(next.years)) if(fsEmpty || JSON.stringify(next.years[y]) !== JSON.stringify(S.years[y])) batch.set(col.doc(y), pack(next.years[y]));
    if(!fsEmpty) for(const y of Object.keys(S.years)) if(!next.years[y]) batch.delete(col.doc(y));
    const upd = {by: who, at: new Date().toISOString()};
    batch.set(fb.db.collection('meta').doc('info'), {updated: upd});
    await batch.commit();
    S = next; S.updated = upd; fsEmpty = false; if(keepYear) year = keepYear;
    refresh(); toast('บันทึกแล้ว', 2500);
    return true;
  }catch(e){
    const c = e && e.code;
    if(c==='permission-denied') toast('บัญชีนี้ไม่มีสิทธิ์บันทึก ตรวจสอบ Firestore Rules ตามคู่มือ', 6000);
    else if(c==='unavailable') toast('เชื่อมต่ออินเทอร์เน็ตไม่ได้ บันทึกไม่สำเร็จ', 5000);
    else toast('บันทึกไม่สำเร็จ ('+(c||'error')+') ลองอีกครั้ง', 5000);
    return false;
  }finally{ busy = false; }
}

    f.querySelectorAll('input[name=src]').forEach(r => r.addEventListener('change', () => $('#xlsxbox').hidden = !$('#src-xlsx').checked));
  }

}

const libP = {};
function loadLib(src, name){
  return libP[src] || (libP[src] = new Promise((res, rej) => {
    if(window[name]) return res(window[name]);
    const s = document.createElement('script'); s.src = src;
    s.onload = () => window[name] ? res(window[name]) : rej(new Error('load'));
    s.onerror = () => { delete libP[src]; rej(new Error('load')); };
    document.head.appendChild(s);
  }));
}
const loadXLSX = () => loadLib('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', 'XLSX');

const COLS = {
  learn:  [['no','ลำดับ',7,'c'],['name','ชื่อแหล่งเรียนรู้',33],['addr','ที่ตั้ง',35],['keeper','ผู้ดูแล (บุคลากรในสถานศึกษา)',25]],
  read:   [['no','ลำดับ',7,'c'],['name','ชื่อแหล่งเรียนรู้',31],['addr','ที่ตั้ง',37],['keeper','ผู้ดูแล (บุคลากรในสถานศึกษา)',25]],
  network:[['no','ลำดับ',7,'c'],['name','ชื่อภาคีเครือข่าย',30],['addr','ที่ตั้ง/ที่อยู่',30],['role','บทบาทการมีส่วนร่วม/การส่งเสริมและสนับสนุน',33]],
  wisdom: [['no','ลำดับ',7,'c'],['name','รายชื่อ',22],['skill','ความชำนาญ',28],['addr','ที่อยู่',30],['phone','เบอร์โทร',13]]
};
function cellText(x,k){ if(k==='addr' && x.owner) return x.addr + ' (เจ้าของ: ' + x.owner + ')'; return x[k] == null ? '' : x[k]; }
function buildReport(scope){
  const root = $('#rpt'); root.innerHTML = ''; root.hidden = false;
  const printed = new Date().toLocaleDateString('th-TH', {year:'numeric', month:'long', day:'numeric'});
  const runHead = `<div class="rhead"><span>ทำเนียบแหล่ง/องค์กร ส่งเสริมการเรียนรู้ · ปีงบประมาณ พ.ศ. ${esc(year)}</span><span>อำเภอเทิง จังหวัดเชียงราย</span></div>`;
  const pages = []; let body;
  const newPage = () => {
    const p = document.createElement('div'); p.className = 'rpage';
    p.innerHTML = runHead + '<div class="rbody"></div><div class="rfoot"><span>ข้อมูล ณ วันที่ ' + esc(printed) + '</span><span class="pn"></span></div>';
    root.appendChild(p); pages.push(p); body = p.querySelector('.rbody');
  };
  const fits = () => body.scrollHeight <= body.clientHeight + 1;
  let sections;
  if(scope === 'all'){
    newPage();
    const total = CATS.reduce((s,c)=>s+(D()[c.id]||[]).length,0);
    body.innerHTML = `<div class="rcover"><p class="k">ทำเนียบ</p><h1>แหล่ง/องค์กร ส่งเสริมการเรียนรู้</h1><p class="k">อำเภอเทิง จังหวัดเชียงราย</p><span class="y">ปีงบประมาณ พ.ศ. ${esc(year)}</span>
      <table class="rsum">${CATS.map(c=>`<tr><td>${esc(c.t)}</td><td>${(D()[c.id]||[]).length}</td></tr>`).join('')}<tr class="tot"><td>รวมทั้งสิ้น</td><td>${total}</td></tr></table></div>`;
    sections = CATS.map(c => ({c, rows: D()[c.id] || [], note: ''}));
  } else {
    const c = CATS.find(c=>c.id===cur), rows = filtered().map(([x])=>x);
    const a = $('#area').value, q = $('#q').value.trim();
    const note = [a && a, q && ('คำค้น “'+q+'”')].filter(Boolean).join(' · ');
    sections = [{c, rows, note}];
  }
  for(const s of sections){
    newPage();
    const cols = COLS[s.c.id];
    const start = cont => {
      const h = document.createElement('h2'); h.className = 'rh2';
      h.innerHTML = esc(s.c.t) + (cont ? ' (ต่อ)' : '') + ` <small>${s.rows.length} รายการ${s.note ? ' · ' + esc(s.note) : ''}</small>`;
      const t = document.createElement('table'); t.className = 'rtbl';
      t.innerHTML = '<colgroup>' + cols.map(c=>`<col style="width:${c[2]}%">`).join('') + '</colgroup><thead><tr>' + cols.map(c=>`<th${c[3]?' class="c"':''}>${esc(c[1])}</th>`).join('') + '</tr></thead><tbody></tbody>';
      body.appendChild(h); body.appendChild(t);
      return t.tBodies[0];
    };
    let tb = start(false);
    if(!s.rows.length){ tb.innerHTML = `<tr><td colspan="${cols.length}" class="c">ไม่มีข้อมูล</td></tr>`; continue; }
    for(const x of s.rows){
      const tr = document.createElement('tr');
      tr.innerHTML = cols.map(c=>`<td${c[3]?' class="c"':''}>${esc(cellText(x,c[0]))}</td>`).join('');
      tb.appendChild(tr);
      if(!fits() && tb.rows.length > 1){ tr.remove(); newPage(); tb = start(true); tb.appendChild(tr); }
    }
  }
  pages.forEach((p,i) => p.querySelector('.pn').textContent = `หน้า ${i+1} / ${pages.length}`);
  return pages;
}
let downloads = null;
const standalone = true;
$('#pdfBtn').hidden = false;
async function makePdf(scope){
  if(!downloads && !standalone){ toast('ดาวน์โหลดไฟล์ไม่ได้ในหน้านี้', 4000); return false; }
  toast('กำลังเตรียมสร้าง PDF…');
  let h2c, jsp;
  try{
    [h2c, jsp] = await Promise.all([
      loadLib('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', 'html2canvas'),
      loadLib('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', 'jspdf')
    ]);
  }catch(_){ toast('โหลดเครื่องมือสร้าง PDF ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่', 5000); return false; }
  try{ await document.fonts.ready; }catch(_){}
  const pages = buildReport(scope);
  try{
    const pdf = new jsp.jsPDF({orientation:'landscape', unit:'mm', format:'a4', compress:true});
    for(let i=0;i<pages.length;i++){
      toast(`กำลังสร้าง PDF หน้า ${i+1} / ${pages.length}…`);
      const cv = await h2c(pages[i], {scale:2, backgroundColor:'#ffffff', logging:false});
      if(i) pdf.addPage();
      pdf.addImage(cv.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 297, 210);
    }
    const tag = scope==='all' ? 'ทั้งหมด' : CATS.find(c=>c.id===cur).t;
    const blob = pdf.output('blob');
    $('#toast').hidden = true;
    const fname = `ทำเนียบแหล่งองค์กรส่งเสริมการเรียนรู้_${year}_${tag}.pdf`;
    if(standalone){ const u = URL.createObjectURL(blob), a = document.createElement('a'); a.href = u; a.download = fname; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u), 10000); }
    else await downloads.save({filename:fname, data:blob});
    toast('บันทึกไฟล์ PDF แล้ว', 3000);
    return true;
  }catch(e){
    const c = e && e.code;
    if(c==='declined'){ toast('ยกเลิกการบันทึกไฟล์', 3000); return true; }
    if(c==='rate_limited'){ toast('มีหน้าต่างบันทึกไฟล์เปิดอยู่ รอสักครู่แล้วลองใหม่', 4000); return false; }
    if(c && c!=='bad_request'){ downloads = null; $('#pdfBtn').hidden = true; toast('ดาวน์โหลดไฟล์ไม่ได้ในหน้านี้', 4000); return true; }
    toast('สร้าง PDF ไม่สำเร็จ', 4000); return false;
  }finally{ $('#rpt').innerHTML = ''; $('#rpt').hidden = true; }
}
function parseSheet(rows, cat){
  const out = [];
  for(const r of rows){
    const c = [0,1,2,3].map(i => clean(r[i]));
    if(!c.some(Boolean)) continue;
    if(!/^\d+$/.test(c[0])){
      if(!c[0] && out.length){ const extra = c.filter(Boolean).join(' '), last = out[out.length-1]; if(cat==='network') last.name += ' '+extra; else last.addr += ' / '+extra; }
      continue;
    }
    const [a,b,x,d] = c; let e;
    if(cat==='wisdom'){
      const ph = d.match(/0\d[\d\s-]{7,11}\d/);
      e = {no:+a, name:b, skill:x, addr:d.replace(/\(?\s*0\d[\d\s-]{7,11}\d\s*\)?/,'').replace(/[\s()]+$/,'').trim(), phone: ph ? fmtPhone(ph[0]) : ''};
    } else if(cat==='network') e = {no:+a, name:b, addr:x, role:d};
    else e = {no:+a, name:b.replace(/^"|"$/g,''), addr:x, keeper:d};
    out.push(e);
  }
  out.forEach(e => {
    if(cat==='wisdom' && !e.phone){ const m = e.addr.match(/\((0\d{9})\)/); if(m){ e.phone = fmtPhone(m[1]); e.addr = e.addr.replace(m[0],'').trim(); } }
    e.area = areaOf(e.addr);
  });
  return out.sort((p,q) => p.no - q.no);
}
async function readXlsx(file){
  const X = await loadXLSX();
  const wb = X.read(await file.arrayBuffer(), {type:'array'});
  const pats = {learn:/^\s*แหล่งเรียนรู้/, read:/อ่าน/, network:/ภาคี/, wisdom:/ภูมิปัญญา/};
  const data = {};
  CATS.forEach((c,i) => {
    const name = wb.SheetNames.find(n => pats[c.id].test(n)) || wb.SheetNames[i];
    data[c.id] = name ? parseSheet(X.utils.sheet_to_json(wb.Sheets[name], {header:1, defval:null}), c.id) : [];
  });
  return data;
}

$('#form').addEventListener('submit', async e => {
  e.preventDefault(); if(!modal || busy) return;
  const err = m => { $('#merr').textContent = m; };
  if(modal.kind==='login'){
    const name = $('#f-user').value.replace(/\s+/g,'').replace(/^ครู/,'');
    const pass = $('#f-pass').value.replace(/\D/g,'');
    if(!name || !pass) return err('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน');
    if(!fb) return err(fbMsg);
    const m = STAFF.find(s => s.n === name);
    if(!m) return err('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
    $('#msave').disabled = true;
    try{ await fb.auth.signInWithEmailAndPassword(m.e + '@' + DOMAIN, pass); }
    catch(e){
      const c = e && e.code;
      return err(c==='auth/too-many-requests' ? 'ลองผิดหลายครั้งเกินไป รอสักครู่แล้วลองใหม่' : c==='auth/network-request-failed' ? 'เชื่อมต่ออินเทอร์เน็ตไม่ได้' : 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
    }finally{ $('#msave').disabled = false; }
    who = m.f; editOn = true; closeModal(); renderEdit(); renderList(); toast('ยินดีต้อนรับ ' + who, 2500);
    return;
  }
  if(modal.kind==='pdf'){
    const scope = $('#ps-cur').checked ? 'cur' : 'all';
    $('#msave').disabled = true;
    try{ if(await makePdf(scope)) closeModal(); else err('สร้างหรือบันทึกไฟล์ไม่สำเร็จ ลองอีกครั้ง'); }
    finally{ $('#msave').disabled = false; }
    return;
  }
  const next = clone(S);
  if(modal.kind==='entry'){
    const x = {no: parseInt($('#f-no').value,10) || 0};
    for(const [k,l,req] of FIELDS[cur]){ const v = clean($('#f-'+k).value); if(req && !v) return err('กรุณากรอก '+l); if(v) x[k] = k==='phone' ? fmtPhone(v) : v; }
    if(!x.no) return err('กรุณากรอกลำดับที่เป็นตัวเลข');
    x.area = areaOf(x.addr);
    const list = next.years[year][cur] = next.years[year][cur] || [];
    if(modal.idx == null) list.push(x); else list[modal.idx] = x;
    list.sort((p,q) => p.no - q.no);
    if(await save(next)) closeModal();
  } else {
    const y = String(parseInt($('#f-year').value,10) || '');
    if(!/^2[5-7]\d\d$/.test(y)) return err('กรุณากรอกปี พ.ศ. 4 หลัก เช่น 2570');
    if(S.years[y]) return err('มีปีงบประมาณ '+y+' อยู่แล้ว');
    let data;
    if($('#src-copy').checked) data = clone(S.years[$('#f-from').value]);
    else if($('#src-empty').checked) data = {learn:[],read:[],network:[],wisdom:[]};
    else {
      const file = $('#f-file').files[0]; if(!file) return err('กรุณาเลือกไฟล์ Excel');
      try{ $('#msave').disabled = true; data = await readXlsx(file); }
      catch(_){ return err('อ่านไฟล์ไม่ได้ ตรวจสอบว่าเป็นไฟล์ .xlsx รูปแบบเดียวกับไฟล์ทำเนียบเดิม'); }
      finally{ $('#msave').disabled = false; }
      const n = CATS.reduce((s,c)=>s+data[c.id].length,0);
      if(!n) return err('ไม่พบรายการในไฟล์ ตรวจสอบว่าคอลัมน์แรกเป็นลำดับที่');
    }
    next.years[y] = data;
    if(await save(next, y)) closeModal();
  }
});

(function initFirebase(){
  const cfg = window.FIREBASE_CONFIG;
  if(!window.firebase){ fbMsg = 'โหลดระบบฐานข้อมูลไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วเปิดหน้าใหม่'; return; }
  if(!cfg || !cfg.apiKey || !/^AIza/.test(cfg.apiKey)){ fbMsg = 'ยังไม่ได้ตั้งค่า Firebase (ไฟล์ firebase-config.js) จึงแก้ไขข้อมูลไม่ได้ หน้านี้แสดงข้อมูลสำรองในไฟล์'; return; }
  try{
    firebase.initializeApp(cfg);
    const auth = ADMIN ? firebase.auth() : null, db = firebase.firestore();
    fb = {auth, db};
    if(ADMIN){
      auth.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(()=>{});
      let first = true;
      auth.onAuthStateChanged(u => {
        const m = u && STAFF.find(s => s.e + '@' + DOMAIN === u.email);
        who = m ? m.f : ''; if(!who) editOn = false;
        renderEdit(); renderList();
        if(first && !who && !modal) openModal('login');
        first = false;
      });
    }
    db.collection('years').onSnapshot(snap => {
      fsEmpty = snap.empty;
      if(!snap.empty){ const ys = {}; snap.forEach(d => ys[d.id] = pack(d.data())); S.years = ys; }
      refresh();
    }, () => toast('โหลดข้อมูลจากฐานข้อมูลไม่สำเร็จ กำลังแสดงข้อมูลสำรองในไฟล์', 5000));
    db.collection('meta').doc('info').onSnapshot(d => { if(d.exists && d.data().updated){ S.updated = d.data().updated; renderYear(); } }, () => {});
  }catch(e){ fb = null; fbMsg = 'ตั้งค่า Firebase ไม่ถูกต้อง: ' + (e && e.message || e); }
})();
})();
